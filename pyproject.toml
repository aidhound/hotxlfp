[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hotxlfp"
version = "1.0.2"
description = "A python version of the javascript handsontable excel formula parser"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Leonel Câmara", email = "leonelcamara@gmail.com" }
]
keywords = ["excel", "formula", "parser"]
requires-python = ">=3.9"
dependencies = [
    "ply",
    "python-dateutil",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/aidhound/hotxlfp"
Download = "https://github.com/aidhound/hotxlfp/archive/1.0.2.tar.gz"

[tool.setuptools]
packages = ["hotxlfp", "hotxlfp._compat", "hotxlfp.helper", "hotxlfp.formulas", "hotxlfp.grammarparser"]

[dependency-groups]
dev = [
    "coverage",
]
